[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pi-voice-ai"
version = "0.4.0.dev0"
description = "Low-latency voice assistant foundation for Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiortc==1.15.0",
    "fastapi==0.141.1",
    "numpy==2.4.6",
    "openai==3.19.2",
    "pydantic-settings==2.15.0",
    "sherpa-onnx==1.13.8",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
