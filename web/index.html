<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PiVoice AI — WebRTC Loopback</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">PiVoice AI · Fase 2</p>
      <h1>Teste de áudio WebRTC</h1>
      <p class="description">
        O microfone do navegador será enviado ao Raspberry Pi e retornará ao seu
        alto-falante. Use fones de ouvido para evitar microfonia.
      </p>

      <div class="status-row" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <span id="status">Desconectado</span>
      </div>

      <div class="actions">
        <button id="start" type="button">Iniciar loopback</button>
        <button id="stop" class="secondary" type="button" disabled>Encerrar</button>
      </div>

      <p id="error" class="error" role="alert"></p>
      <audio id="remote-audio" autoplay></audio>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
