<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PiVoice AI — Transcrição local</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">PiVoice AI · Fase 3</p>
      <h1>Transcrição local</h1>
      <p class="description">
        O navegador envia o microfone por WebRTC. O Raspberry Pi converte a fala
        em texto localmente, sem enviar áudio para serviços externos.
      </p>

      <div class="status-row" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <span id="status">Desconectado</span>
      </div>

      <div class="actions">
        <button id="start" type="button">Conectar microfone</button>
        <button id="record" type="button" disabled>Começar a falar</button>
        <button id="stop" class="secondary" type="button" disabled>Desconectar</button>
      </div>

      <label class="loopback-option">
        <input id="loopback" type="checkbox">
        Ouvir retorno do microfone
      </label>

      <section class="transcript" aria-live="polite" aria-labelledby="transcript-title">
        <div class="transcript-heading">
          <h2 id="transcript-title">Transcrição</h2>
          <span id="metrics"></span>
        </div>
        <p id="transcript-text">A transcrição aparecerá aqui.</p>
      </section>

      <p id="error" class="error" role="alert"></p>
      <audio id="remote-audio" autoplay muted></audio>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
